px4_pid_benchmark:
  ros__parameters:
    fig8_r: 1.0
    fig8_w: 0.3
    fig8_ramp: 0.0  # 与 NMPC 一致：0=4s，负数=自动，正数=指定秒数
    z_hover: 3.0    # MAVROS ENU 绝对高度；xy 相对启动时位置
    dz: 0.5
    hover_time: 2.0
    yaw_ramp: false
    velocity_feedforward: true
    rate_hz: 50.0
    warmup_time: 2.0
    takeoff_time: 8.0
    settle_time: 2.0
    position_tolerance: 0.2
    duration: 60.0  # TRACK 开始起计，包含 hover_time 和轨迹 ramp
    stop_time: 4.0
    telemetry_timeout: 1.0
